[package]
name = "typr"
version = "0.1.4"
description = "A dictation app powered by Whisper"
authors = ["you"]
edition = "2021"

[lib]
name = "typr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
reqwest = { version = "0.12", features = ["multipart", "json", "stream"] }
hound = "3.5"
tokio = { version = "1", features = ["full"] }
dirs = "6"
arboard = "3"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
simplelog = "0.12"
# macOS uses the system Keychain automatically — no platform feature needed
keyring = "3"
# rdev grab suppresses bound mouse buttons before the OS sees them
rdev = { version = "0.5", features = ["unstable_grab"] }
