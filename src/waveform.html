<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typr</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 320px;
        height: 90px;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }

      /* The visible pill — sits 1 px inside the transparent window so the
         box-shadow doesn't get clipped on the very edge. */
      #shell {
        position: absolute;
        inset: 2px;
        background: rgba(13, 10, 25, 0.91);
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.07);
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.75),
          0 0 0 1px rgba(140, 80, 255, 0.15),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        padding: 10px 16px 8px;
      }

      /* ── Bar visualizer ─────────────────────── */
      #bars {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 2px;
        width: 100%;
        height: 46px;
        flex-shrink: 0;
      }

      canvas {
        display: block;
      }

      /* ── Status strip ───────────────────────── */
      #status {
        display: flex;
        align-items: center;
        gap: 5px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.9px;
        text-transform: uppercase;
        color: rgba(200, 170, 255, 0.65);
        flex-shrink: 0;
      }

      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #a855f7;
        flex-shrink: 0;
        animation: blink 1.4s ease-in-out infinite;
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.25; }
      }

      /* Transcribing state */
      body.transcribing .dot {
        background: #f59e0b;
        animation: pulse-dot 1s ease-in-out infinite;
      }

      body.transcribing #status {
        color: rgba(255, 210, 120, 0.65);
      }

      @keyframes pulse-dot {
        0%, 100% { transform: scale(1);   opacity: 1; }
        50%       { transform: scale(1.6); opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <div id="shell">
      <div id="bars">
        <canvas id="canvas" width="286" height="46"></canvas>
      </div>
      <div id="status">
        <div class="dot"></div>
        <span id="status-text">Recording</span>
      </div>
    </div>
    <script type="module" src="/src/waveform.ts"></script>
  </body>
</html>
