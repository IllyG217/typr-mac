name: Build macOS

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      matrix:
        include:
          # Apple Silicon (M1/M2/M3/M4) — runs on arm64 runner natively
          - target: aarch64-apple-darwin
            runner: macos-latest
          # Intel Mac — runs on x86_64 runner natively (macos-13 is the last Intel runner)
          - target: x86_64-apple-darwin
            runner: macos-13

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # ── Whisper-cpp sidecar ────────────────────────────────────────────────
      # Built natively on each runner — no cross-compilation needed.
      # The binary is named exactly as Tauri expects:
      #   binaries/whisper-cpp-aarch64-apple-darwin
      #   binaries/whisper-cpp-x86_64-apple-darwin
      - name: Build whisper-cpp sidecar
        run: |
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp whisper-src
          cd whisper-src
          # Note: do NOT disable examples — whisper-cli is an example target
          cmake -B build \
            -DWHISPER_BUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j$(sysctl -n hw.logicalcpu)
          # Locate the CLI binary — name varies across whisper.cpp versions
          BINARY=$(find build/bin -type f \( -name "whisper-cli" -o -name "main" \) 2>/dev/null | head -1)
          if [ -z "$BINARY" ]; then
            echo "ERROR: could not find whisper CLI binary. Available files:"
            find build -type f -perm +111 | head -30
            exit 1
          fi
          echo "Found whisper binary: $BINARY"
          mkdir -p ../src-tauri/binaries
          cp "$BINARY" ../src-tauri/binaries/whisper-cpp-${{ matrix.target }}
          chmod +x ../src-tauri/binaries/whisper-cpp-${{ matrix.target }}
          cd ..
          rm -rf whisper-src

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Typr-macOS-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
